local directory = debug.getinfo(1, 'S').source:sub(2):match('(.*/)')
conky.config = dofile(directory .. 'common.lua')
conky.config.alignment = 'bottom_left'
conky.config.gap_x = 350
conky.config.gap_y = 30

conky.text = [[
${voffset 6}${color1}${font JetBrains Mono:bold:size=9}PROCESSOR${font}${color}
${voffset 2}${color2}${stippled_hr}${color}
${voffset 2}${color1}• CPU:${alignr}${cpu}%
${color2}${cpubar 4}
${voffset 2}${color1}• Temp:${alignr}${execi 10 ~/.config/conky/get-temp.sh}°C
${voffset 2}${color1}• Processes:${alignr}${processes}
${color1}• Running:${alignr}${running_processes}
]];
