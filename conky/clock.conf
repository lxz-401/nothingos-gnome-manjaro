local directory = debug.getinfo(1, 'S').source:sub(2):match('(.*/)')
conky.config = dofile(directory .. 'common.lua')
-- Centered above the NOTHING wordmark on the 1920x1080 desktop.
conky.config.alignment = 'top_middle'
conky.config.gap_x = 0
conky.config.gap_y = 230
conky.config.minimum_height = 0
conky.config.minimum_width = 640
conky.config.maximum_width = 640
conky.config.border_inner_margin = 0
conky.config.font = 'Inter:size=9'

conky.text = [[
${alignc}${color1}${font Inter:style=Light:size=72}${time %H:%M}${font}
${alignc}${color2}${font Inter:size=11}${time %A, %d %B %Y}${font}
${alignc}${nodename}
${alignc}${color2}${kernel}
${alignc}Uptime: ${uptime}
]];
