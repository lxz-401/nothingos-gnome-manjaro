conky.text = [[
${alignc}${color1}${font JetBrains Mono:size=18}${time %H:%M}${font}
${alignc}${color2}${font JetBrains Mono:size=9}${time %A, %d %B %Y}${font}
${alignc}${nodename}
${alignc}${color2}${kernel}
${alignc}Uptime: ${uptime}
]];
