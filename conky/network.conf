local directory = debug.getinfo(1, 'S').source:sub(2):match('(.*/)')
conky.config = dofile(directory .. 'common.lua')
conky.config.alignment = 'bottom_left'
conky.config.gap_x = 1340
conky.config.gap_y = 30

conky.text = [[
${voffset 6}${color1}${font JetBrains Mono:bold:size=9}NETWORK${font}${color}
${voffset 2}${color2}${stippled_hr}${color}
${if_existing /proc/net/route wlan0}
${voffset 2}${color1}• WiFi:${alignr}${wireless_essid wlan0}
${voffset 2}${color1}• Signal:${alignr}${wireless_link_qual_perc wlan0}%
${color2}${wireless_link_bar 4 wlan0}
${voffset 2}${color1}• Down:${alignr}${downspeed wlan0}
${color2}${downspeedgraph wlan0 20,300 AAAAAA FFFFFF}
${voffset 2}${color1}• Up:${alignr}${upspeed wlan0}
${color2}${upspeedgraph wlan0 20,300 AAAAAA FFFFFF}
${voffset 2}${color1}• Total Down/Up:${alignr}${totaldown wlan0} / ${totalup wlan0}
${else}${if_existing /proc/net/route enp7s0}
${voffset 2}${color1}• LAN:${alignr}Connected
${voffset 2}${color1}• Down:${alignr}${downspeed enp7s0}
${color2}${downspeedgraph enp7s0 20,300 AAAAAA FFFFFF}
${voffset 2}${color1}• Up:${alignr}${upspeed enp7s0}
${color2}${upspeedgraph enp7s0 20,300 AAAAAA FFFFFF}
${voffset 2}${color1}• Total Down/Up:${alignr}${totaldown enp7s0} / ${totalup enp7s0}
${else}
${voffset 2}${color1}• Network:${alignr}Disconnected
${endif}${endif}
]];
