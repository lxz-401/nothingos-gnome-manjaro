local directory = debug.getinfo(1, 'S').source:sub(2):match('(.*/)')
conky.config = dofile(directory .. 'common.lua')
conky.config.alignment = 'bottom_left'
conky.config.gap_x = 1010
conky.config.gap_y = 30

conky.text = [[
${voffset 6}${color1}${font JetBrains Mono:bold:size=9}STORAGE${font}${color}
${voffset 2}${color2}${stippled_hr}${color}
${voffset 2}${color1}• Root:${alignr}${fs_used /} / ${fs_size /}
${color2}${fs_bar 4 /}
${voffset 2}${color1}• I/O:${alignr}${diskio}
${color2}${diskiograph 20,300 AAAAAA FFFFFF}
${if_existing /sys/class/power_supply/BAT0}
${voffset 6}${color1}${font JetBrains Mono:bold:size=9}BATTERY${font}${color}
${voffset 2}${color2}${stippled_hr}${color}
${voffset 2}${color1}• Status:${alignr}${battery_status BAT0}
${voffset 2}${color1}• Battery:${alignr}${battery_percent BAT0}%
${color2}${battery_bar 4 BAT0}
${voffset 2}${color1}• Time left:${alignr}${battery_time BAT0}
${endif}
]];
